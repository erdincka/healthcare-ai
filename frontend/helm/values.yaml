replicaCount: 1

image:
  repository: nexusglobal/triageai
  # Leave empty to use the chart's appVersion.
  tag: "1.2.1"
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: "1Gi"
    cpu: "1000m"
  limits:
    memory: "2Gi"
    cpu: "2000m"

ezua:
  virtualService:
    endpoint: "healthcare.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
